[project]
name = "menubench"
version = "0.0.1"
description = "Benchmark and reference pipeline for menu price extraction with selective prediction"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.9",
    "typer>=0.12",
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "playwright>=1.64.1",
    "pyyaml>=6.0.3",
    "pillow>=13.0.0",
    "numpy>=2.5.4",
    "rapidfuzz>=3.14.6",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "sse-starlette>=3.6.0",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "pypdfium2>=5.14.0",
]

[project.scripts]
menubench = "menubench.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Cyrillic is first-class in menus and fixtures
ignore = ["RUF001", "RUF002", "RUF003", "SIM108", "SIM905"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "render: needs a Playwright Chromium",
    "live: calls real model APIs (opt-in)",
    "e2e: browser tests against the built frontend (opt-in)",
]
addopts = "-m 'not live and not e2e'"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx` with `starlette.testclient`"]

[tool.uv]
python-preference = "managed"
