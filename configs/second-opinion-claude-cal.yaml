# Claude Haiku reads the menu end to end; the reference pipeline (Gemini 2.5 Flash-Lite) checks it independently.
# Their agreement is the confidence signal. Calibrated on dev; prices at the frozen 1%-risk threshold are auto-placed.
name: second-opinion-claude-cal
pipeline: second_opinion
split: dev
budget_usd: 3.0
llm_concurrency: 8
models:
  vlm: anthropic/claude-haiku-5.5
  ocr: google/gemini-2.5-flash-lite
  attribution: google/gemini-2.5-flash-lite
  arbiter: google/gemini-2.5-flash-lite
params:
  link: strict
  calibrator: configs/calibration/second-opinion-claude.json
  target_risk: 0.01
