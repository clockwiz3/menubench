# v0.2 (second-opinion-claude-cal) with tilted pages straightened before reading. Same calibrator and threshold,
# so the difference is the straightening alone. Boxes are mapped back onto the original page for scoring.
name: ablation-deskew
pipeline: second_opinion
split: dev
budget_usd: 2.0
llm_concurrency: 8
models:
  vlm: anthropic/claude-haiku-5.5
  ocr: google/gemini-2.5-flash-lite
  attribution: google/gemini-2.5-flash-lite
  arbiter: google/gemini-2.5-flash-lite
params:
  link: strict
  calibrator: configs/calibration/second-opinion-claude.json
  target_risk: 0.01
  deskew: true
