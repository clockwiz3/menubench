# What the public demo and the annotator's pre-labelling run: v0.2 plus pixel-exact boxes for people to look at.
# The benchmark scores raw model boxes against typographic line boxes, so refinement stays off in benchmark configs.
name: demo
pipeline: second_opinion
split: test
budget_usd: 1.0
llm_concurrency: 8
models:
  vlm: anthropic/claude-haiku-5.5
  ocr: google/gemini-2.5-flash-lite
  attribution: google/gemini-2.5-flash-lite
  arbiter: google/gemini-2.5-flash-lite
params:
  link: strict
  calibrator: configs/calibration/second-opinion-claude.json
  target_risk: 0.01
  refine_boxes: true
  deskew: true  # straighten tilted photos before reading; boxes are mapped back onto the original
